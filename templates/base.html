<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Error Knowledge Base{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="site-header">
    <div class="header-inner">
        <a class="site-title" href="{{ url_for('index') }}">Error Knowledge Base</a>
        <nav><a href="{{ url_for('index') }}">一覧</a><a href="{{ url_for('create') }}">新規登録</a></nav>
    </div>
</header>
<main class="container">
{% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}<div class="flash-message {{ category }}">{{ message }}</div>{% endfor %}
{% endwith %}
{% block content %}{% endblock %}
</main>
</body>
</html>
